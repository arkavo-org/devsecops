AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Handle Resolution Service for ATProto

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource naming

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC

  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: Redis node type for ElastiCache cluster

  DomainName:
    Type: String
    Default: arkavo.net
    Description: Domain name for DNS configuration

  XrpcSubdomain:
    Type: String
    Default: xrpc
    Description: Subdomain for XRPC endpoint

  EC2InstanceType:
    Type: String
    Default: "c4.large"
    AllowedValues:
      - "t3.small"
      - "c4.large"

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: prod-identity
    Description: Name of an existing EC2 KeyPair for SSH access

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        REDIS_ENDPOINT: !GetAtt RedisCluster.ReaderEndPoint.Address
        DYNAMODB_TABLE: !Ref HandleTable
        PYTHONWARNINGS: "ignore:Unverified HTTPS request"
        LOG_LEVEL: "INFO"

Mappings:
  RegionMap:
    us-east-1:
      ApiGwHostedZoneId: Z1UJRXOUMOOFQ8
    us-east-2:
      ApiGwHostedZoneId: ZOJJZC49E0EPZ
    us-west-1:
      ApiGwHostedZoneId: Z2MUQ32089INYE
    us-west-2:
      ApiGwHostedZoneId: Z2OJLYMUO9EFXC
    af-south-1:
      ApiGwHostedZoneId: Z2LHQQ2MN2RDXU
    ap-east-1:
      ApiGwHostedZoneId: Z3FD1VL95ZNJKG
    ap-south-1:
      ApiGwHostedZoneId: Z3VO1THU9YC4UR
    ap-northeast-1:
      ApiGwHostedZoneId: Z1YSHQZHG15GKL
    ap-northeast-2:
      ApiGwHostedZoneId: Z20JF4UZKIW1U8
    ap-southeast-1:
      ApiGwHostedZoneId: Z1LMS91P8CMLE5
    ap-southeast-2:
      ApiGwHostedZoneId: Z2RPCDW04V8134
    eu-central-1:
      ApiGwHostedZoneId: Z1U9ULNL0V5AJ3
    eu-west-1:
      ApiGwHostedZoneId: ZLY8HYME6SFDD
    eu-west-2:
      ApiGwHostedZoneId: ZJ5UAJN8Y3Z2Q
    eu-south-1:
      ApiGwHostedZoneId: Z3UD5QRXMK4VX4
    eu-west-3:
      ApiGwHostedZoneId: Z3KY65QWINUZ85
    eu-north-1:
      ApiGwHostedZoneId: Z3UWIKFBR1L3HS
    me-south-1:
      ApiGwHostedZoneId: Z20ZBPC0SS8806
    sa-east-1:
      ApiGwHostedZoneId: ZCMLWB8V5SYIT

Resources:
  # VPC Resources
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-handle-check-vpc

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [ 0, !Cidr [ !Ref VpcCIDR, 4, 8 ] ]
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-private-subnet-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [ 1, !Cidr [ !Ref VpcCIDR, 4, 8 ] ]
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-private-subnet-2

  # Route Tables for Private Subnets
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-private-rt-1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-private-rt-2

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # DynamoDB VPC Endpoint
  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - "dynamodb:GetItem"
              - "dynamodb:PutItem"
              - "dynamodb:DeleteItem"
              - "dynamodb:Query"
              - "dynamodb:Scan"
            Resource:
              - !GetAtt HandleTable.Arn
              - !GetAtt ProfilesTable.Arn
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

  # Security Groups
  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Redis cluster
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda function
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0

  # Redis Resources
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for Redis cluster
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedisCluster:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: Redis cluster for handle availability cache
      Engine: redis
      EngineVersion: '7.0'
      CacheNodeType: !Ref RedisNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true

  # DynamoDB Resources
  HandleTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-handles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: handle
          AttributeType: S
      KeySchema:
        - AttributeName: handle
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  CredentialsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-credentials
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: username-index
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  # NOTE: prod-identity-links, prod-device-bindings, and prod-patreon-tokens
  # were created out-of-band via `aws dynamodb create-table` before being
  # codified here. Bring them into the stack with a CFN IMPORT change-set,
  # not a normal deploy (a normal deploy would fail with
  # AlreadyExistsException). Retain policies guard against stack-delete or
  # replacement wiping live data.
  IdentityLinksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-identity-links
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: link_pk
          AttributeType: S
      KeySchema:
        - AttributeName: link_pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  DeviceBindingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-device-bindings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  PatreonTokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-patreon-tokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # KMS key for authnz-rs Patreon token sealing (envelope encryption:
  # per-row AES-256-GCM DEKs wrapped via kms:Encrypt, unwrapped via
  # kms:Decrypt). Referenced by authnz-rs as
  # PATREON_KMS_KEY_ID=alias/arkavo-patreon-token-key. Created out-of-band
  # in the console 2026-06-11 (key id 7b1a7a20-295e-480e-bf06-651f67060929);
  # pending IMPORT — see NOTE above. cf-arkavo-production has
  # kms:Encrypt/Decrypt via the key policy (key user), not IAM.
  PatreonTokenKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Arkavo Patreon token sealing (DEK wrapping for authnz-rs)
      EnableKeyRotation: true
      Tags:
        - Key: Purpose
          Value: patreon-token-sealing
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  PatreonTokenKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    Properties:
      AliasName: alias/arkavo-patreon-token-key
      TargetKeyId: !Ref PatreonTokenKey

  # NOTE: did:webvh v1.0 mandates the eddsa-jcs-2022 (Ed25519) cryptosuite, and
  # AWS KMS cannot sign Ed25519 — so the did:webvh log update key is a software
  # Ed25519 key file held by authnz-rs (WEBVH_SIGN_KEY_PATH), NOT a KMS key.
  # There is intentionally no KMS resource for it here.

  # Lambda Function and API Gateway (using SAM)
  HandleCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-handle-resolution
      CodeUri: ./src
      Handler: app.handler
      Tracing: Active
      Layers:
        - !Ref DependenciesLayer
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Events:
        GetHandle:
          Type: Api
          Properties:
            Path: /xrpc/com.atproto.identity.resolveHandle
            Method: get
        HeadHandle:
          Type: Api
          Properties:
            Path: /xrpc/com.atproto.identity.resolveHandle
            Method: head
      AutoPublishAlias: live
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HandleTable
        - VPCAccessPolicy: { }

  # Lambda Layer for Dependencies
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${Environment}-handle-check-deps
      Description: Dependencies for handle check function
      ContentUri: ./dependencies/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Retain

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [ 2, !Cidr [ !Ref VpcCIDR, 4, 8 ] ]
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [ 3, !Cidr [ !Ref VpcCIDR, 4, 8 ] ]
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-public-subnet-2

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # EC2 Security Group
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Rust web server
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 76.100.17.26/32
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIpv6: 2601:147:c400:9cc0:d855:dce:bdd5:caf2/128
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0

  # EC2 IAM Role
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: HandlesTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt HandleTable.Arn
        - PolicyName: CredentialsTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt CredentialsTable.Arn
                  - !Sub "${CredentialsTable.Arn}/index/*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  # EC2 Instance
  Authnz:
      Type: AWS::EC2::Instance
      Properties:
        InstanceType: !Ref EC2InstanceType
        ImageId: ami-01816d07b1128cd2d
        SubnetId: !Ref PublicSubnet1
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        KeyName: !Ref KeyPairName
        IamInstanceProfile: !Ref EC2InstanceProfile
        Tags:
          - Key: Name
            Value: !Sub ${Environment}-authnz

  # Route53 Resources
  RootDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: "Z09772883U0XNWXDMKA2V"
      Name: !Ref DomainName
      Type: A
      TTL: 300
      ResourceRecords:
        - !GetAtt Authnz.PublicIp

  # ProfilesTable definition
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-profiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: handle
          AttributeType: S
      KeySchema:
        - AttributeName: handle
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Profile Lambda Function
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-profile
      CodeUri: profile/
      Handler: app.lambda_handler
      Runtime: python3.12
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          PROFILES_TABLE_NAME: !Ref ProfilesTable
          POWERTOOLS_SERVICE_NAME: profile-service
          POWERTOOLS_METRICS_NAMESPACE: ProfileService
      Events:
        GetProfile:
          Type: Api
          Properties:
            Path: /xrpc/app.arkavo.actor.getProfile
            Method: get
            RestApiId: !Ref ServerlessRestApi
      AutoPublishAlias: live
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
        - VPCAccessPolicy: {}

